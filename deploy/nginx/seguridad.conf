# Cabeceras comunes. nginx no hereda add_header dentro de un location que define
# otros add_header, por eso cada location incluye este archivo.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Trusted Types en modo report-only (fase 1). Cuando /csp-reports quede sin
# violaciones, cambia a Content-Security-Policy para aplicarla.
# nfo = política del orchestrator de Native Federation; angular y angular#bundler = Angular.
add_header Content-Security-Policy-Report-Only "require-trusted-types-for 'script'; trusted-types nfo angular angular#bundler 'allow-duplicates'; report-uri /csp-reports" always;
